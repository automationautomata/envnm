version: "2"
sql:
  - engine: "postgresql"
    queries: "assets/queries"
    schema: "assets/init.sql"
    gen:
      go:
        package: "queries"
        out: "internal/repository/postgres/queries/"
        sql_package: "pgx/v5"
        emit_db_tags: true
        emit_pointers_for_null_types: true 
        overrides:
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
              
          - db_type: "timestamptz"
            go_type:
              import: "time"
              type: "Time"

          - db_type: "time"
            go_type:
              import: "time"
              type: "Time"
          
          - db_type: "variable_entry"
            go_type:
              import: "envmn/internal/repository/postgres/dbtypes"
              type: "VariableEntry"
           